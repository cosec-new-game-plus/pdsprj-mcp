[project]
name = "pdsprj-mcp"
version = "0.1.0"
description = "MCP server for reading and modifying Proteus 8 .pdsprj schematic files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Spiridonov" }]
requires-python = ">=3.12"
keywords = ["mcp", "proteus", "pdsprj", "8051", "at89c51", "schematic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "fastmcp>=3.2.4",
    "pydantic>=2.13.2",
]

[project.scripts]
pdsprj-mcp = "pdsprj_mcp.mcp_server:main"

[project.urls]
Repository = "https://github.com/danspiridonov/pdsprj-mcp"
Issues = "https://github.com/danspiridonov/pdsprj-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdsprj_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
